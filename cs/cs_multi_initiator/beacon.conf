#
# Extra configuration of a BEACON build (on top of prj.conf):
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp -d build_b1 --pristine -- \
#       -DEXTRA_CONF_FILE=beacon.conf -DCONFIG_IL_BEACON_ID=1
#
# A beacon is a CS initiator while it measures the other beacons at boot (central),
# then a CS reflector for the mobile node (peripheral).
#

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_RAS_RRSP=y
CONFIG_BT_RAS_RRSP_MAX_ACTIVE_CONN=2

CONFIG_BT_CTLR_SDC_CS_ROLE_INITIATOR_ONLY=n
CONFIG_BT_CTLR_SDC_CS_ROLE_BOTH=y

# Same as the stock Nordic reflector: the initiating device controls the link
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_CTLR_PHY_2M=y

# The beacon reboots itself if the beacon-to-beacon measurement hangs or is incomplete
CONFIG_REBOOT=y

# Beacons run on a battery (18650 on the BAT pads), without USB. A beacon prints nothing that
# is needed, so the console UART is off: with it on, the UART TX pin back-powers the unpowered
# USB-UART bridge of the XIAO and the board may not start until USB is plugged in.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
