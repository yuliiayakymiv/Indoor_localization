# Available runners configured by board.cmake.
runners:
- openocd
- nrfutil
- nrfjprog
- jlink

# Default flash runner if --runner is not given.
flash-runner: openocd

# Default debug runner if --runner is not given.
debug-runner: openocd

# Common runner configuration values.
config:
  board_dir: C:/ncs/v3.4.2/zephyr/boards/seeed/xiao_nrf54l15
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: C:/ncs/toolchains/5f5ef0cea0/opt/zephyr-sdk/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py.exe
  openocd: C:/openocd/bin/openocd.exe
  openocd_search:
    - C:/ncs/toolchains/5f5ef0cea0/opt/zephyr-sdk/hosttools/openocd/share/openocd/scripts

# Runner specific arguments
args:
  openocd:
    - --cmd-load
    - flash write_image erase
    - --cmd-verify
    - verify_image
    - --cmd-load=nrf54l-load
    - -c
    - targets nrf54l.cpu
  nrfutil:
    []

  nrfjprog:
    []

  jlink:
    - --dt-flash=y
    - --device=nRF54L15_M33
    - --speed=4000
