CONFIG_BT_DEVICE_NAME="CS_Reflector_M1"

# Bluetooth Core & Roles
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y

# Channel Sounding & SoftDevice Controller
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_LL_SOFTDEVICE=y

# Пам'ять та буфери (Запобігає MPU Fault 0x9 та Unhandled ATT 0x16)
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_BT_ATT_PREPARE_COUNT=5
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16

# Розміри стеків та підтримка Float
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MPSL_WORK_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=y

# Внутрішній RC-генератор LFRC (Обов'язково для XIAO nRF54L15)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Стабільне логування
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BT_LOG_LEVEL_INF=y
